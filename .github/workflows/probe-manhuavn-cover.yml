name: Probe ManhuaVN cover links
on:
  push:
    branches: [fix/manhuavn-cover-v5-20261010]
    paths:
      - tools/probe_manhuavn_covers.py
      - .github/workflows/probe-manhuavn-cover.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_manhuavn_covers.py
