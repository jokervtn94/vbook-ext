name: Synchronize legacy main-branch VBook authors
on:
  push:
    branches: [master]
    paths: ['.github/workflows/sync-main-authors.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-main-author-sync
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize all legacy manifests and their ZIPs
        run: python tools/sync_authors.py
      - name: Verify every source and shipped ZIP
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('.')
          source_count = package_count = 0
          for path in sorted(root.glob('*/plugin.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['metadata']['author'] == 'Jokervtn94', str(path)
              source_count += 1
          for path in sorted(root.glob('*/plugin.zip')):
              with ZipFile(path) as archive:
                  data = json.loads(archive.read('plugin.json').decode('utf-8'))
                  assert data['metadata']['author'] == 'Jokervtn94', str(path)
                  assert archive.testzip() is None, str(path)
              package_count += 1
          index = json.loads((root / 'plugin.json').read_text(encoding='utf-8'))
          assert index['metadata']['author'] == 'Jokervtn94'
          assert all(x['author'] == 'Jokervtn94' for x in index['data'])
          print(f'PASS: {source_count} source manifests and {package_count} ZIP archives on main')
          PY
      - name: Commit corrected historic files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin.json '*/plugin.json' '*/plugin.zip'
          if ! git diff --cached --quiet; then
            git commit -m "chore: normalize legacy VBook author Jokervtn94"
            git push origin HEAD:main
          fi
