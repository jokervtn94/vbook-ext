name: Live chapter source checks
on:
  push:
    branches: [fix/novelbuddy-toc-manhuavn-20261010]
    paths:
      - 'tests/test_live_source_contracts.py'
      - '.github/workflows/live-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tests/test_live_source_contracts.py
