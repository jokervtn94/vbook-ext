name: Check remaining source domains
on:
  push:
    branches: [fix/active-sources-prune-20261010]
    paths:
      - tools/check_remaining_sources.py
      - .github/workflows/check-domains.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/check_remaining_sources.py
