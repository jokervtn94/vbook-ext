name: Validate extension catalog

on:
  push:
    branches:
      - master
      - 'maintenance/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # GitHub-token build commits do not start push workflows; validate the
  # finalized branch after each archive builder completes.
  workflow_run:
    workflows:
      - 'Sync previously stale Vbook packages'
      - 'Package 69Shuba and UUKanShu'
      - 'Synchronize published VBook authors'
    types: [completed]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile main.py clean.py tools/validate_extensions.py tools/audit_structure.py tools/inspect_packages.py tools/check_package_sync.py tools/check_published_scripts.py
      - name: Validate migrated JavaScript syntax
        run: find manhuavn/src tranh18/src sayhentai/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Parse every published JavaScript file and validate linked dependencies
        run: python tools/check_published_scripts.py
      - name: Test new reader repair regressions
        run: node tests/test_reader_repair_batch.js
      - name: Test ManhuaVN chapter regressions
        run: node tests/test_vbook_regressions.js
      - name: Validate Qimao author metadata
        run: node tests/test_qimao_detail.js
      - name: Validate Say Hentai domain and chapter handling
        run: node tests/test_sayhentai_reader.js
      - name: Validate CiWeiMao API decryption inputs and access controls
        run: node tests/test_ciweimao_chap.js
      - name: Validate Book QQ reading contracts
        run: node tests/test_bookqq_reader.js
      - name: Validate UUKanShu chapter/TOC parsing
        run: node tests/test_uukanshu_reader.js
      - name: Validate 69Shuba Cloudflare handling
        run: node tests/test_shuba69_cloudflare.js
      - name: Validate 69Shuba detail, TOC and chapter reading
        run: node tests/test_shuba69_reader.js
      - name: Validate 69Shuba Vbook DOM compatibility
        run: node tests/test_shuba69_vbook_dom.js
      - name: Validate Dingdian covers and detail fallback
        run: node tests/test_dingdian_covers.js
      - name: Validate TruyenQQKO reader and Cloudflare handling
        run: node tests/test_truyenqqko_reader.js
      - name: Validate TruyenGGVN reader and Cloudflare handling
        run: node tests/test_truyenggvn_reader.js
      - name: Validate ManhuaVN cover normalization and listing regressions
        run: node tests/test_manhuavn_covers.js
      - name: Enforce Jokervtn94 in catalog, source and shipped ZIPs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          repo = Path('.')
          catalog = json.loads((repo / 'plugin.json').read_text(encoding='utf-8'))
          assert catalog['metadata']['author'] == 'Jokervtn94'
          for entry in catalog['data']:
              folder = entry['path'].split('/')[-2]
              source = json.loads((repo / folder / 'plugin.json').read_text(encoding='utf-8'))
              with ZipFile(repo / folder / 'plugin.zip') as zf:
                  archive = json.loads(zf.read('plugin.json').decode('utf-8'))
                  assert zf.testzip() is None, folder
              assert entry['author'] == 'Jokervtn94', folder
              assert source['metadata']['author'] == 'Jokervtn94', folder
              assert archive['metadata']['author'] == 'Jokervtn94', folder
              assert source['metadata']['version'] == entry['version'] == archive['metadata']['version'], folder
          print('Verified publisher and archive version for', len(catalog['data']), 'readers')
          PY
      - name: Verify every published ZIP matches current source
        run: |
          python - <<'PY'
          import json
          from tools.check_package_sync import check
          with open('plugin.json', encoding='utf-8') as stream:
              entries = json.load(stream)['data']
          mismatches = []
          for entry in entries:
              folder = entry['path'].split('/')[-2]
              try:
                  check(folder)
              except (ValueError, OSError) as exc:
                  mismatches.append(f'{folder}: {exc}')
                  print('MISMATCH:', mismatches[-1], flush=True)
          print('SYNC STATUS:', len(entries)-len(mismatches), 'matching of', len(entries))
          if mismatches:
              raise SystemExit('Out-of-sync ZIPs: ' + ', '.join(mismatches))
          PY
      - name: Verify repaired ZIP contents match source
        run: python tools/check_package_sync.py manhuavn tranh18 sayhentai acqq bookqq tienvuc myrics sachhayonline dingdian
      - name: Enforce Vietnamese/Chinese-only reader catalog
        run: python tools/validate_language_policy.py
      - name: Validate catalog assets
        run: python tools/validate_extensions.py
      - name: Validate generated README
        run: python main.py --check
      - name: Inspect package layout and versions
        run: python tools/inspect_packages.py
      - name: Audit Vbook extension structure
        run: python tools/audit_structure.py
