name: Validate extension catalog

on:
  push:
    branches:
      - master
      - main
      - 'maintenance/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile main.py clean.py tools/validate_extensions.py tools/audit_structure.py tools/inspect_packages.py tools/check_package_sync.py tools/check_published_scripts.py
      - name: Validate migrated JavaScript syntax
        run: find manhuavn/src tranh18/src novelbuddy/src sayhentai/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Parse every published JavaScript file and validate linked dependencies
        run: python tools/check_published_scripts.py
      - name: Test new reader repair regressions
        run: node tests/test_reader_repair_batch.js
      - name: Test NovelBuddy TOC and ManhuaVN chapter regressions
        run: node tests/test_vbook_regressions.js
      - name: Validate 69Shuba Vbook DOM compatibility
        run: node tests/test_shuba69_vbook_dom.js
      - name: Validate ManhuaVN cover normalization and listing regressions
        run: node tests/test_manhuavn_covers.js
      - name: Verify repaired ZIP contents match source
        run: python tools/check_package_sync.py manhuavn tranh18 novelbuddy sayhentai omegascans acqq bookqq tienvuc myrics sachhayonline dingdian
      - name: Validate catalog assets
        run: python tools/validate_extensions.py
      - name: Validate generated README
        run: python main.py --check
      - name: Inspect package layout and versions
        run: python tools/inspect_packages.py
      - name: Audit Vbook extension structure
        run: python tools/audit_structure.py
