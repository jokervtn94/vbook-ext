name: Probe Qimao live data
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-qimao-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4
      - name: Test website list, details and legacy app API
        run: |
          python - <<'PY'
          import requests,hashlib,json,re
          from bs4 import BeautifulSoup
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            ('old-list','https://www.qimao.com/shuku/a-a-a-a-a-a-a-update_time-1/'),
            ('new-list','https://www.qimao.com/shuku/a-a-a-a-a-a-a-update_time-1/'),
            ('base-list','https://www.qimao.com/shuku/'),
            ('book','https://www.qimao.com/shuku/2015930/'),
            ('book-old','https://www.qimao.com/shuku/151581/'),
            ('home','https://www.qimao.com/')
          ]
          for label,url in urls:
            try:
              r=s.get(url,timeout=16)
              d=BeautifulSoup(r.text,'html.parser')
              print('PAGE',label,'HTTP',r.status_code,'URL',r.url,'SIZE',len(r.content),'TITLE',d.title.get_text(' ',strip=True)[:95] if d.title else '',flush=True)
              for selector in ['.qm-pic-txt li','.s-tit a','.qm-pic-txt','a[href*="/shuku/"]','meta[property="og:image"]','script#__NEXT_DATA__','.book-name','.book-info','h1','a[href*="/reader/"]']:
                elements=d.select(selector)
                print('  CSS',selector,len(elements),'FIRST',str(elements[0])[:280] if elements and label in ('base-list','new-list','book') else '',flush=True)
              for a in d.select('a[href*="/shuku/"]')[:4]:
                print('  BOOKLINK',a.get('href'),a.get_text(' ',strip=True)[:70],flush=True)
              for js in d.select('script[src]')[:6]:
                print('  SCRIPT',js.get('src')[:180],flush=True)
              print('  HTMLFIRST',re.sub(r'\s+',' ',r.text[:400]),flush=True)
            except Exception as e:print('FAIL',label,type(e).__name__,str(e)[:170],flush=True)
          key='d3dGiJc651gSQ8w1'
          h={'platform':'android','app-version':'71900','application-id':'com.kmxs.reader','sign':hashlib.md5(('app-version=71900application-id=com.kmxs.readerplatform=android'+key).encode()).hexdigest(),'user-agent':'webviewversion/0'}
          api=[
            ('detail','https://api-bc.wtzw.com/api/v5/book/detail?id=151581&sign='+hashlib.md5(('id=151581'+key).encode()).hexdigest()),
            ('search','https://api-bc.wtzw.com/api/v7/search/words?wd=%E4%BF%AE%E4%BB%99&sign='+hashlib.md5(('wd=修仙'+key).encode()).hexdigest()),
            ('toc','https://api-ks.wtzw.com/api/v1/chapter/chapter-list?id=151581&sign='+hashlib.md5(('id=151581'+key).encode()).hexdigest())
          ]
          for label,url in api:
            try:
              r=s.get(url,headers=h,timeout=17)
              print('API',label,r.status_code,r.url.split('?')[0],r.headers.get('content-type'),'LEN',len(r.content),'BODY',r.text[:530].replace('\n',' '),flush=True)
            except Exception as e:print('APIERROR',label,type(e).__name__,str(e)[:180],flush=True)
          PY

      - name: Inspect current catalog card and chapter HTML contracts
        run: |
          python - <<'PY'
          import requests,hashlib,re
          from bs4 import BeautifulSoup
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls={'catalog':'https://www.qimao.com/shuku/a-a-a-a-a-a-a-update_time-1/','search':'https://www.qimao.com/search/index/?keyword=%E4%BF%AE%E4%BB%99','detail':'https://www.qimao.com/shuku/151581/'}
          for name,url in urls.items():
            r=s.get(url,timeout=18);soup=BeautifulSoup(r.text,'html.parser')
            print('PAGE',name,r.status_code,len(r.content),flush=True)
            for a in soup.select('.s-tit a')[:1]:
              print('TITLE_ANCHOR',str(a)[:550],flush=True)
              p=a
              for i in range(4):
                p=p.parent
                print('ANCESTOR',i,str(p)[:1350],flush=True)
            if name=='detail':
              for selector in ['.book-detail','.book-desc','.book-intro','.book-pic','.book-img','.book-cover','.book-name','.book-title','.writer','.book-detail-title','.book-details','.chapter-list','.catalog','.chapter-item','a[href*="/shuku/"]']:
                es=soup.select(selector)
                print('DETAILSELECT',selector,len(es),str(es[0])[:380] if es else '',flush=True)
              for script in soup.find_all('script'):
                txt=script.get_text()
                if 'chapterList' in txt or 'chapter_lists' in txt:
                  print('SCRIPTCHAPTER',txt[:700],flush=True);break
          key='d3dGiJc651gSQ8w1'
          h={'platform':'android','app-version':'71900','application-id':'com.kmxs.reader','user-agent':'webviewversion/0','sign':hashlib.md5(('app-version=71900application-id=com.kmxs.readerplatform=android'+key).encode()).hexdigest()}
          query='chapterId=345141&id=151581'
          sign=hashlib.md5(('chapterId=345141id=151581'+key).encode()).hexdigest()
          url='https://api-ks.wtzw.com/api/v1/chapter/content?'+query+'&sign='+sign
          try:
            r=s.get(url,headers=h,timeout=18)
            data=r.json();v=data.get('data') if isinstance(data,dict) else None
            print('CHAPTER_API',r.status_code,'CODE',data.get('code'),'MESSAGE',str(data.get('msg') or data.get('message'))[:220],'DATA_TYPE',type(v).__name__,'DATA_KEYS',list(v.keys())[:24] if isinstance(v,dict) else [],'CONTENT_LEN',len(str(v.get('content',''))) if isinstance(v,dict) else None,'BODY',r.text[:320],flush=True)
          except Exception as e:print('CHAPTER_ERROR',type(e).__name__,str(e)[:250],flush=True)
          PY
