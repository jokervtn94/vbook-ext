name: Probe ACQQ live website
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-acqq-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4
      - name: Inspect Tencent comics domains
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          paths=[
            ('desktop-list','https://ac.qq.com/Comic/all'),
            ('desktop-detail','https://ac.qq.com/Comic/ComicInfo/id/650953'),
            ('mobile-home','https://m.ac.qq.com/'),
            ('mobile-category','https://m.ac.qq.com/category/index'),
            ('mobile-category2','https://m.ac.qq.com/comic/category'),
            ('mobile-ranking','https://m.ac.qq.com/rank/index'),
            ('mobile-detail','https://m.ac.qq.com/comic/index/id/650953'),
            ('mobile-chapter','https://m.ac.qq.com/chapter/index/id/650953/cid/1'),
            ('desktop-chapter','https://ac.qq.com/ComicView/index/id/650953/cid/1'),
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          sels=['a.mod-cover-list-thumb[href]','.mod-cover-list-thumb','.comic-pic-list img','a[href*="/comic/index/id/"]','a[href*="/Comic/ComicInfo/id/"]','a[href*="/chapter/index/id/"]','a[href*="/ComicView/index/id/"]','meta[property="og:image"]','h1','img[data-src]','img[data-original]','img','.chapter-list','.comic-list','.comic-item','.cate-list','.rank-list','a[href*="category"]','a[href*="/rank/"]','script']
          for label,url in paths:
            try:
              r=s.get(url,timeout=14);d=BeautifulSoup(r.text,'html.parser')
              title=d.title.get_text(' ',strip=True)[:90] if d.title else ''
              print('PAGE',label,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TITLE',title,flush=True)
              for sel in sels:
                a=d.select(sel)
                if a and (sel!='script' or label in ('mobile-detail','mobile-chapter')):print('  SEL',sel,len(a),'FIRST',str(a[0])[:500],flush=True)
              for a in d.select('a[href]'):
                href=a.get('href','')
                if '/comic/index/id/' in href or '/chapter/index/id/' in href:
                  print('  LINK',a.get_text(' ',strip=True)[:55],href[:180],flush=True)
                  if sum(1 for _ in d.select('a[href*="/comic/index/id/"]'))>45:break
              print('  HTML',re.sub(r'\s+',' ',r.text[:280]),flush=True)
            except Exception as e:print('ERROR',label,type(e).__name__,str(e)[:250],flush=True)
          PY

      - name: Analyze real selectors and embedded chapter image manifest
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/130.0 Mobile Safari/537.36'})
          urls={
            'home':'https://m.ac.qq.com/',
            'categories':'https://m.ac.qq.com/category/index',
            'category-theme':'https://m.ac.qq.com/category/index/theme/1',
            'rank':'https://m.ac.qq.com/rank/biaosheng',
            'search':'https://m.ac.qq.com/search/index?key=%E4%BA%BA',
            'detail':'https://m.ac.qq.com/comic/index/id/650953',
            'chapter':'https://m.ac.qq.com/chapter/index/id/650953/cid/1'
          }
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=18);d=BeautifulSoup(r.text,'html.parser')
              print('TARGET',name,r.status_code,r.url,len(r.content),flush=True)
              for selector in ['.comic-item','.comic-item a','.comic-item img','.comic-list li','.recommend-list li','.rank-item','.comic-link','.item-cover','.category-item','.category-list a','.chapter-link','.head-cover','.comic-pic-list img','#comicContain img','.comic-pic-list','.comic-img','img[data-src]','.chapter-content img','.comic-cover','.head-info-desc','.comic-intro','.author-name','h1.top-title','a[href*=\"/category/\"]']:
                es=d.select(selector)
                if es:
                  print(' DOM',selector,len(es),'FIRST',str(es[0])[:530].replace('\n',' '),flush=True)
              for a in d.select('a[href*="/category/"]')[:30]:
                print(' GENRE',a.get_text(' ',strip=True)[:60],a.get('href'),flush=True)
              if name=='chapter':
                for token in ['picture','chapter_data','img_list','imgList','comic-pic','data-src','__DATA__','__NUXT__','__INITIAL_STATE__','base64','DATA','chapterInfo','chapterComicInfo','comicImages','chapterPicture','picture-list','picList','comicPic','picUrl','imageUrls','cid']:
                  print(' TOKEN',token,len(list(re.finditer(re.escape(token),r.text,re.I))),flush=True)
                for script in d.find_all('script'):
                  raw=script.get_text(' ',strip=False)
                  if len(raw)>1000 and any(t in raw.lower() for t in ['imglist','comic-pic','chapter_data','picture','chapterinfo','picurl','comicpic']):
                    print(' EMBEDDED_SCRIPT',len(raw),raw[:4200].replace('\n',' ')[:4200],flush=True)
                print(' IMAGE_ELEMENTS',[str(x)[:480] for x in d.find_all('img')[:10]],flush=True)
            except Exception as e:print('ERROR',name,type(e).__name__,str(e)[:220],flush=True)
          PY

      - name: Inspect category list and mobile search semantics
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13; Pixel 7) Chrome/130 Mobile Safari/537.36'})
          urls=[
            'https://m.ac.qq.com/category/listAll?type=xh&rank=pgv',
            'https://m.ac.qq.com/category/listAll?type=rx&rank=pgv',
            'https://m.ac.qq.com/category/listAll?type=tm&rank=upt',
            'https://m.ac.qq.com/search/index',
            'https://m.ac.qq.com/search/index?key=%E4%BA%BA',
            'https://m.ac.qq.com/search/index?word=%E4%BA%BA',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=14);d=BeautifulSoup(r.text,'html.parser')
              print('ROUTE',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TITLE',d.title.get_text(' ',strip=True)[:95] if d.title else '',flush=True)
              for q in ['.comic-item','.comic-link','.comic-cover','.comic-list li','.list-item','.comic-book','.item-cover','.item-title','a[href*="/comic/index/id/"]','input[name]','form[action]']:
                v=d.select(q)
                if v:print(' CSS',q,len(v),'FIRST',str(v[0])[:620].replace('\n',' '),flush=True)
              for tag in d.select('script'):
                txt=tag.get_text()
                for word in ['searchComic','keyWord','searchKeyword','searchResult','typeId','listAll']:
                  i=txt.find(word)
                  if i>=0:print(' JS',word,txt[max(0,i-180):i+300].replace('\n',' ')[:480],flush=True)
            except Exception as e:print('ERROR',str(e)[:200],flush=True)
          PY
