name: Probe Dingdian cover markup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-dingdian-cover.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4
      - name: Inspect website and cover image candidates
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.dingdian666.com/xiaoshuo/537816/',
            'https://m.dingdian666.com/ebooks/537816/',
            'https://www.dingdian666.com/sort/3_1/',
            'https://m.dingdian666.com/',
            'https://www.dingdian666.com/'
          ]
          for url in urls:
            try:
              r=session.get(url,timeout=17)
              doc=BeautifulSoup(r.text,'html.parser')
              print('\nPAGE',url,'STATUS',r.status_code,'FINAL',r.url,'LENGTH',len(r.text),'TITLE',doc.title.get_text(' ',strip=True)[:100] if doc.title else '',flush=True)
              for key in ['.border_left img','.border_left a img','.bookimg img','.book-img img','.bookcover img','.book_info img','.pic img','.picbox img','.left img','.cover img','.book-item img','.lastupdate ul li','.lastupdate ul li img','.book-list li img']:
                print('SELECTOR',key,'COUNT',len(doc.select(key)),flush=True)
              for m in doc.find_all('meta'):
                if 'image' in (m.get('property','')+m.get('name','')).lower():
                  print('META',str(m)[:400],flush=True)
              for img in doc.find_all('img')[:15]:
                print('IMG',str(img)[:700],flush=True)
              for a in doc.find_all('a',href=True):
                if re.search(r'/xiaoshuo/\d+',a['href']):
                  print('NOVEL_LINK',a['href'],str(a.parent)[:650],flush=True)
                  break
            except Exception as e:print('ERROR',url,type(e).__name__,str(e)[:240],flush=True)
          PY

      - name: Verify cover CDN responses and category selectors
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.dingdian666.com/'})
          source='https://www.dingdian666.com/sort/3_1/'
          resp=s.get(source,timeout=15)
          soup=BeautifulSoup(resp.content,'html.parser')
          for selector in ['.sort_5tu li','.sort_5tu ul li','.sort_5tu img','.lastupdate ul li','.lastupdate ul li .name a','.lastupdate ul li a','.border_left a img','.border_left img']:
              elements=soup.select(selector)
              print('EXACT_SELECT',selector,'COUNT',len(elements),'FIRST',str(elements[0])[:650] if elements else None,flush=True)
          for host in ['www.dingdian666.com','dingdian666.com','m.dingdian666.com']:
              u='https://'+host+'/files/article/image/152/152799/152799s.jpg'
              try:
                  r=s.get(u,timeout=15)
                  print('COVER',r.status_code,r.url,len(r.content),r.headers.get('Content-Type'),r.content[:10],flush=True)
              except Exception as e:print('COVER ERROR',str(e)[:180],flush=True)
          PY

      - name: Inspect masked image payload
        run: |
          python - <<'PY'
          import requests
          s=requests.Session()
          urls=[
            'https://www.dingdian666.com/files/article/image/152/152799/152799s.jpg',
            'https://www.dingdian666.com/files/article/image/160/160605/160605s.jpg',
            'https://www.dingdian666.com/files/article/image/000.jpg',
            'https://m.dingdian666.com/files/article/image/2/2639/2639s.jpg',
          ]
          for url in urls:
            for referer in ['', 'https://www.dingdian666.com/xiaoshuo/537816/']:
              try:
                headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'}
                if referer:headers['Referer']=referer
                r=s.get(url,headers=headers,timeout=12)
                print('IMAGE',url,'REFERER',bool(referer),'HTTP',r.status_code,'MIME',r.headers.get('Content-Type'),'BYTES',len(r.content),'BODY',repr(r.content[:650]),flush=True)
              except Exception as e:print('ERROR',str(e)[:250],flush=True)
          PY
