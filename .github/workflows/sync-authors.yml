name: Synchronize published VBook authors

on:
  push:
    branches: [master]
    paths:
      - '*/plugin.json'
      - '*/src/**'
      - 'plugin.json'
      - 'tools/sync_authors.py'
      - '.github/workflows/sync-authors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-existing-reader-packages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize authors and rebuild all published ZIPs
        run: python tools/sync_authors.py
      - name: Check archive consistency
        run: |
          python tools/validate_extensions.py
          python tools/inspect_packages.py
      - name: Publish corrected archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin.json README.md '*/plugin.json' '*/plugin.zip'
          if ! git diff --cached --quiet; then
            git commit -m "build: publish VBook extensions by Jokervtn94"
            git push origin HEAD:master
          fi
