name: Normalize VBook extension authors
on:
  push:
    branches: [main, master]
    paths:
      - '*/plugin.json'
      - '*/plugin.zip'
      - 'plugin.json'
      - 'tools/sync_authors.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_authors.py
      - name: Commit normalized extension metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.json '*/plugin.json' '*/plugin.zip'
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize publisher author Jokervtn94"
            git push
          fi
