name: Probe website migrations
on:
  push:
    branches:
      - fix/active-sources-prune-20261010
    paths:
      - tools/probe_live.py
      - .github/workflows/probe-live.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_live.py
