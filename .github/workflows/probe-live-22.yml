name: Diagnose 22 Vbook reader sources
on:
  push:
    branches: [fix/live-audit-22-extension-readers-20261010]
    paths:
      - tools/probe_live_22.py
      - .github/workflows/probe-live-22.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_live_22.py
