name: Probe WuxiaWorld chapter index scripts
on:
  push:
    branches: [master]
    paths:
      - 'tools/probe_wuxiaworld_toc.py'
      - '.github/workflows/probe-wuxiaworld-toc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_wuxiaworld_toc.py
