name: Diagnose pagination
on:
  push:
    branches: [fix/novelbuddy-toc-manhuavn-20261010]
    paths:
      - 'tools/diagnose_novelbuddy_pagination.py'
      - '.github/workflows/diagnose-pagination.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/diagnose_novelbuddy_pagination.py
