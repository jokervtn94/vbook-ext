name: Build migrated Vbook extensions
on:
  push:
    branches:
      - fix/active-sources-prune-20261010
    paths:
      - '.github/workflows/build-migrations.yml'
      - 'tools/build_extensions.py'
      - 'manhuavn/**'
      - 'tranh18/**'
      - 'novelbuddy/**'
      - 'sayhentai/**'
      - 'plugin.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/active-sources-prune-20261010
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: |
          find manhuavn/src tranh18/src novelbuddy/src sayhentai/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Rebuild three migrated ZIPs
        run: python tools/build_extensions.py manhuavn tranh18 novelbuddy sayhentai --apply
      - name: Inspect built distributions
        run: python tools/inspect_packages.py manhuavn tranh18 novelbuddy sayhentai
      - name: Validate catalog assets
        run: python tools/validate_extensions.py
      - name: Verify README
        run: python main.py --check
      - name: Audit extension structure
        run: python tools/audit_structure.py
      - name: Commit ZIP distributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manhuavn/plugin.zip tranh18/plugin.zip novelbuddy/plugin.zip sayhentai/plugin.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: distribute migrated crawlers v3/v2 [skip ci]"
            git push origin HEAD:fix/active-sources-prune-20261010
          fi
