name: Probe Hotruyen DOM
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-hotruyen-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4
      - name: Inspect home search detail and categories
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          root='https://hotruyen1.com'
          paths={
            'home':'/',
            'nam':'/nam-sinh',
            'nam-truyen':'/truyen-nam-sinh/',
            'ngon-tinh':'/truyen-ngon-tinh/',
            'search-empty':'/tim-truyen',
            'search-word':'/tim-truyen?sn=than&pg=1',
            'detail':'/truyen/toan-dan-chuyen-chuc-ngu-long-su-ta-co-the-chem-than-323131373837382D32373437353936'
          }
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36','Accept-Language':'vi-VN,vi;q=0.9'})
          sels=['#newupdate .uitem','#searchresult .sitem','.uitem','.sitem','.book img','.book','.pagination','.pagination li','#searchresult','#newupdate','.dinfo','.dinfo .book img','.book img','#des-info','a[href*="/truyen/"]','a[href*="/tim-truyen?"]','a[href*="/the-loai/"]','input[name]','select[name]','form[action]','img[data-src]']
          for name,route in paths.items():
            try:
              r=s.get(root+route,timeout=16);d=BeautifulSoup(r.text,'html.parser')
              print('PAGE',name,'HTTP',r.status_code,'URL',r.url,'LEN',len(r.content),'TITLE',d.title.get_text(' ',strip=True)[:100] if d.title else '',flush=True)
              for sel in sels:
                found=d.select(sel)
                if found:print('  SEL',sel,'COUNT',len(found),'EXAMPLE',str(found[0])[:850],flush=True)
              for selector in ['#newupdate .uitem','#searchresult .sitem','.uitem','.sitem','.book']:
                node=d.select_one(selector)
                if node:print('  FULL_CARD',selector,str(node)[:1900],flush=True)
              for a in d.select('a[href]'):
                href=a.get('href','')
                if any(x in href for x in ['/tim-truyen?','/truyen-nam-sinh/','/truyen-ngon-tinh/','/truyen-dam-my/','/truyen-bach-hop/']):
                  print('  FILTER',a.get_text(' ',strip=True)[:38],href[:220],flush=True)
              for option in d.select('select option')[:35]:
                print('  OPT',option.get_text(' ',strip=True)[:36],option.get('value'),str(option.parent)[:95],flush=True)
              for img in d.find_all('img')[:9]:
                print('  IMG',str(img)[:430],flush=True)
            except Exception as e:print('FAIL',name,type(e).__name__,str(e)[:250],flush=True)
          PY

      - name: Probe active category routes and search filter contracts
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          root='https://hotruyen1.com'
          paths=['/nu-sinh','/dam-my','/vo-cp','/bach-hop','/ngon-tinh','/khac','/nam-sinh?pg=2','/tim-truyen?tg=_22_','/tim-truyen?sg=0','/tim-truyen?st=1','/tim-truyen?tg=_22_&sn=than']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/128.0'})
          for p in paths:
            try:
              r=s.get(root+p,timeout=12);d=BeautifulSoup(r.text,'html.parser')
              print('ROUTE',p,r.status_code,'FINAL',r.url,'LIST',len(d.select('#newupdate .uitem')),'SEARCH',len(d.select('#searchresult .sitem')),'MSG',d.select_one('#searchresult .text-disabled').get_text(' ',strip=True)[:130] if d.select_one('#searchresult .text-disabled') else '',flush=True)
            except Exception as e:print('ROUTEERROR',p,str(e)[:150],flush=True)
          for p in ['/tim-truyen?sn=than&pg=1','/truyen-nam-sinh/']:
            try:
              d=BeautifulSoup(s.get(root+p,timeout=14).text,'html.parser')
              print('FILTERPAGE',p,flush=True)
              for tag in d.select('input,select,button,a[href*="tim-truyen?"],label')[:220]:
                cl=' '.join(tag.get('class',[]))
                if tag.name in ['input','select','button'] or ('filter' in cl or 'tim-truyen?' in str(tag.get('href',''))):
                  print('FORM',tag.name,'id',tag.get('id'),'name',tag.get('name'),'value',tag.get('value'),'href',tag.get('href'),'data',str(tag.attrs)[:260],'text',tag.get_text(' ',strip=True)[:70],flush=True)
              for sc in d.select('script'):
                js=sc.get_text()
                for word in ['function timkiem','function pageClick','/tim-truyen?','var tg','tagList','?tg=']:
                  pos=js.find(word)
                  if pos>=0:
                    print('SCRIPT_MATCH',word,js[max(0,pos-250):pos+1500].replace('\n',' ')[:1450],flush=True)
            except Exception as e:print('FILTER ERROR',p,str(e)[:170],flush=True)
          PY

      - name: Verify group feeds and existence of distinct book covers
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/129.0'})
          for route in ['/nam-sinh','/ngon-tinh','/dam-my','/vo-cp','/bach-hop','/khac','/nam-sinh?pg=2','/tim-truyen?sn=ngon%20tinh&pg=1']:
            try:
              r=s.get('https://hotruyen1.com'+route,timeout=12)
              d=BeautifulSoup(r.text,'html.parser')
              a=d.select_one('#newupdate .uitem a[href]') or d.select_one('#searchresult .sitem .title a')
              print('GROUP',route,'TITLE',d.title.get_text(' ',strip=True)[:90] if d.title else '', 'FIRST',a.get('href') if a else '', 'COVER',str(d.select_one('#searchresult .sitem img'))[:230] if d.select_one('#searchresult .sitem img') else '',flush=True)
            except Exception as e:print('ERROR',route,str(e)[:120],flush=True)
          home=BeautifulSoup(s.get('https://hotruyen1.com/',timeout=14).text,'html.parser')
          a=home.select('#newupdate .uitem a[href]')
          for link in a[:3]:
            url='https://hotruyen1.com'+link.get('href')
            doc=BeautifulSoup(s.get(url,timeout=13).text,'html.parser')
            images=[str(x)[:240] for x in doc.select('.book img')]
            metas=[str(x)[:240] for x in doc.select('meta[property*=image], meta[name*=image]')]
            print('DETAILIMAGE',url,images,metas,flush=True)
          imgurl='https://hotruyen1.com/Asset/client/images/default.jpg'
          r=s.get(imgurl,timeout=12)
          print('FALLBACKIMAGE',r.status_code,r.headers.get('Content-Type'),len(r.content),r.content[:12].hex(),flush=True)
          PY
