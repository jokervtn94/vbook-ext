name: Rebuild repaired Vbook packages

on:
  push:
    branches: [master]
    paths:
      - 'tools/build_extensions.py'
      - '.github/workflows/rebuild-repaired.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Rebuild only outdated ZIP packages
        run: python tools/build_extensions.py 123truyen sachhayonline --apply
      - name: Verify embedded version and archive integrity
        run: |
          python tools/inspect_packages.py 123truyen sachhayonline
          python tools/audit_structure.py
      - name: Commit repaired ZIP distributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 123truyen/plugin.zip sachhayonline/plugin.zip
          if ! git diff --cached --quiet; then
            git commit -m "fix: rebuild outdated Vbook package versions [skip ci]"
            git push origin HEAD:master
          fi
