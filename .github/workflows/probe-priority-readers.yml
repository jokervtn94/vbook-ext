name: Probe priority Vbook reader endpoints
on:
  push:
    branches: [master]
    paths:
      - 'tools/probe_priority_readers.py'
      - '.github/workflows/probe-priority-readers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_priority_readers.py
