name: Full extension source triage
on:
  push:
    branches: [audit/all-35-sources-20261010]
    paths:
      - tools/audit_all_35_sources.py
      - .github/workflows/audit-all-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/audit_all_35_sources.py
