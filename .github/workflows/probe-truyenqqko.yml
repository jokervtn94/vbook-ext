name: Probe TruyenQQKO source
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-truyenqqko.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe public HTML and official search route
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          import re
          base='https://truyenqqko.com'
          urls=[('home',base+'/doc-truyen'),('listing',base+'/truyen-moi-cap-nhat'),('detail',base+'/truyen-tranh/tien-tu-hay-nghe-ta-giai-thich-22358'),('search',base+'/frontend/search/search')]
          for name,url in urls:
              try:
                  body=urlencode({'search':'One Piece','type':'0'}).encode() if name=='search' else None
                  headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36','Accept-Language':'vi-VN,vi;q=0.9','Referer':base+'/'}
                  if body: headers.update({'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest'})
                  with urlopen(Request(url,headers=headers,data=body),timeout=17) as resp:
                      html=resp.read(500000).decode('utf-8','replace')
                      title=re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)
                      print(name,'HTTP',resp.status,'url',resp.url,'size',len(html),'title',title.group(1)[:150] if title else '',flush=True)
                      for token in ['list_grid','book_avatar','book_name','story-detail-info','list_chapter','page-chapter','cf-challenge','cloudflare','Just a moment','href="/truyen-tranh/']:
                          print('  TOKEN',token,html.lower().count(token.lower()),flush=True)
                      anchors=re.findall(r'href=["\']([^"\']+)',html,re.I)
                      print('  STORY URLS',[x[:130] for x in anchors if '/truyen-tranh/' in x][:5],flush=True)
              except Exception as exc:
                  print(name,'BLOCKED/FAILED',type(exc).__name__,str(exc)[:230],flush=True)
          PY
