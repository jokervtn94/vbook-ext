name: Probe ManhuaGui detail DOM
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-manhuagui-detail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4
      - name: Inspect desktop and mobile detail page layouts
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in ['https://www.manhuagui.com/comic/26729/','https://m.manhuagui.com/comic/26729/','https://www.manhuagui.com/comic/17359/','https://m.manhuagui.com/comic/17359/']:
            try:
              r=s.get(url,timeout=18);d=BeautifulSoup(r.text,'html.parser')
              print('PAGE',url,'HTTP',r.status_code,'FINAL',r.url,'LENGTH',len(r.content),'TITLE',d.title.get_text(' ',strip=True)[:120] if d.title else '',flush=True)
              for q in ['h1','.hcover img','.hcover','.detail-list li','.detail-list','.book-title','.detail-info','.intro','#intro-all','.book-intro','.chapter-list a','meta[property="og:image"]','meta[property="og:title"]','meta[name="description"]','img','.detail-info li','ul.detail-list li','dl dd','.info-detail']:
                a=d.select(q)
                print('SEL',q,len(a),'FIRST',str(a[0])[:650].replace('\n',' ') if a else '',flush=True)
              for node in d.find_all('meta')[:15]:
                if any(key in str(node).lower() for key in ['description','image','title']):
                  print('META',str(node)[:370],flush=True)
              print('TOP_HTML',r.text[:320].replace('\n',' '),flush=True)
            except Exception as e:print('ERROR',url,type(e).__name__,str(e)[:200],flush=True)
          PY

      - name: Inspect mobile metadata and comic cover styles
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          for mode,ua in [('mobile','Mozilla/5.0 (Linux; Android 14; Mobile) Chrome/130 Mobile Safari/537.36'),('desktop','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36')]:
            for base in ['https://www.manhuagui.com/comic/26729/','https://m.manhuagui.com/comic/26729/']:
              try:
                r=requests.get(base,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9'},timeout=15)
                soup=BeautifulSoup(r.text,'html.parser')
                print('REQUEST',mode,base,'FINAL',r.url,r.status_code,flush=True)
                for q in ['h1','dl','dl dt','dl dd','.book-detail','.book-info','.book-cover','.cover','.hcover','.book-info img','.book-cover img','[style*="background"]','[data-original]','[data-src]','[data-cover]','.book-intro','.book-intro p','.book-detail-info','.book-detail-cover','a[href*="cf.mhgui"]']:
                  items=soup.select(q)
                  if items:print(' CSS',q,len(items),str(items[0])[:950].replace('\n',' '),flush=True)
                for x in soup.select('h1,dl,dt,dd')[:25]:
                  print(' META_NODE',str(x)[:700].replace('\n',' '),flush=True)
                for href in re.findall(r'(?:https?:)?//[^\"\s<>]+(?:jpg|jpeg|png|webp)(?:\?[^\"\s<>]*)?',r.text,re.I)[:12]:
                  print(' COVER_CANDIDATE',href[:300],flush=True)
                pos=r.text.find('<h1')
                print(' INFO_SNIP',r.text[max(0,pos-800):pos+3600].replace('\n',' ')[:4400],flush=True)
              except Exception as e:print('ERROR',mode,base,str(e)[:200],flush=True)
          PY
